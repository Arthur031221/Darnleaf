name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag matches the package version
        run: |
          version=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('src/darnleaf/__init__.py').read_text()).group(1))")
          test "v$version" = "$GITHUB_REF_NAME"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: The wheel installs and runs
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl
          /tmp/v/bin/darnleaf --version
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Darnleaf $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
