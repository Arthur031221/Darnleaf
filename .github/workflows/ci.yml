name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Fonts for the synthetic booklet
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - run: pip install -e ".[dev,heic]"
      - run: ruff check src scripts tests
      - run: pytest

  portable:
    # The synthetic booklet draws with DejaVu fonts that only the Linux runner has, so the matcher tests stay there.
    # Everything else (file handling, export, CLI, locales) must also work on macOS and Windows.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,heic]"
      - run: pytest tests/test_cli.py tests/test_export.py tests/test_imaging.py tests/test_preflight.py tests/test_locales.py

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - run: pip install -e .
      - name: Drive the UI in headless Chrome
        run: node --test tests/e2e/ui.test.mjs
        env:
          CHROME_BIN: google-chrome

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip wheel . --no-deps -w dist
      - name: The wheel installs and carries the web UI
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl
          /tmp/v/bin/darnleaf --version
          unzip -l dist/*.whl | grep -q "web/index.html"
          unzip -l dist/*.whl | grep -q "web/locales/zh-TW.json"
