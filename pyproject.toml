[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "darnleaf"
dynamic = ["version"]
description = "Replace damaged pages in a scanned PDF with fresh rescans, matched and reviewed locally."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Arthur031221" }]
keywords = ["pdf", "scan", "rescan", "page-matching", "opencv", "document-repair"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Capture :: Scanners",
]
dependencies = [
  "pypdfium2>=4.30",
  "pikepdf>=9.0",
  "opencv-python-headless>=4.8",
  "numpy>=1.24",
  "pillow>=10.0",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3"]
heic = ["pillow-heif>=0.18"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
darnleaf = "darnleaf.cli:main"

[project.urls]
Homepage = "https://github.com/Arthur031221/Darnleaf"
Demo = "https://arthur031221.github.io/Darnleaf/"
Issues = "https://github.com/Arthur031221/Darnleaf/issues"

[tool.setuptools.dynamic]
version = { attr = "darnleaf.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
darnleaf = ["data/*.gz", "web/*", "web/locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: runs the full matcher on a generated booklet"]

[tool.ruff]
line-length = 160
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM108"]
